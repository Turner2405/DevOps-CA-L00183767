
name: Single Unit Test

on:
  workflow_dispatch:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./Calculator

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: Calculator/pom.xml

      - name: Run Single Unit Test
        run: mvn -B "-Dtest=CalculatorTest#testAdd" test
